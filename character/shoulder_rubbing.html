<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shoulder Rubbing Frog Animation</title>
  <link rel="stylesheet" href="shoulder_rubbing.css">
  <script type="module" src="shoulder_rubbing.js"></script>
</head>

<body>
  <div class="back-container">
            <a href="../shoulder.html" class="back-button">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M19 12H5m7 7-7-7 7-7" />
                </svg>
                <span>Back to shoulder exercises</span>
            </a>
        </div>
  <main>
    <h1>Shoulder Rubbing Animation Frog</h1>
    <p>Drag to rotate and scroll to zoom. Use the buttons to control the animation.</p>
    <model-viewer id="frogModel" src="./models/Shoulder_Rubbing_frog.glb" alt="3D frog shoulder rubbing animation"
      camera-controls shadow-intensity="1" interaction-prompt="auto"></model-viewer>
    <div class="controls">
      <button id="playBtn" disabled>Play</button>
      <button id="pauseBtn" disabled>Pause</button>
      <button id="resetBtn" disabled>Reset</button>
    </div>
    
    
  </main>
</body>

</html>
