<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jumping Frog Animation</title>
  <link rel="stylesheet" href="jumping_frog.css">
  <script type="module" src="jumping_frog.js"></script>
</head>

<body>
  <div class="back-container">
    <a href="../jumping.html" class="back-button">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M19 12H5m7 7-7-7 7-7" />
      </svg>
      <span>Back to jumping page</span>
    </a>
  </div>

  <main>
    <h1>Animated 3D Model of Jumping Frog</h1>
    <p>Use the buttons to control the animation. Drag to rotate and scroll to zoom.</p>
    <section class="animation-card">
      <h2>Jumping Jacks Frog</h2>
      <model-viewer id="frogModel" src="./models/JumpingFrog.glb" alt="Animated 3D frog" camera-controls
        shadow-intensity="1" interaction-prompt="auto"></model-viewer>
      <div class="controls">
        <button id="playBtn" disabled>Play</button>
        <button id="pauseBtn" disabled>Pause</button>
        <button id="resetBtn" disabled>Reset</button>
      </div>
      

      
    </section>
  </main>
</body>

</html>
