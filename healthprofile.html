<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Health Profile</title>
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css">
  <link rel="stylesheet" href="healthprofile.css">
</head>

<body>

  <div class="wrap">

    <nav class="site-nav" aria-label="Primary navigation">
      <a class="site-logo" href="Horizon_home.html">
        <img src="images/Horizon_logo.jpg" alt="New Horizon logo">
        <span>NEW HORIZON</span>
      </a>
    </nav>

    <header>
      <a class="back-explore" href="explore.html">&larr; Back to Explore</a>
      <nav class="page-switcher" aria-label="Health tools">
        <a class="page-switch-link active" href="healthprofile.html">BMI calculator</a>
        <a class="page-switch-link" href="diet.html">BMI diet plan</a>
      </nav>
      <div class="eyebrow">MY HEALTH PROFILE</div>
      <h1>Know your numbers</h1>
      <p>Fill in your details to see your BMI, where it sits on the scale, and a few honest next steps.</p>
    </header>

    <div class="layout">

      <div class="card">
        <h2>Your details</h2>

        <div class="field">
          <label>Name</label>
          <input type="text" id="name" placeholder="e.g. Alex">
        </div>

        <div class="row-2">
          <div class="field">
            <label>Age</label>
            <input type="number" id="age" placeholder="30" min="1" max="120">
          </div>
          <div class="field">
            <label for="sex">Sex</label>
            <select id="sex">
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </div>
        </div>

        <div class="inputs-row">
          <div class="input-box">
            <label>Weight (kg)</label>
            <input type="number" id="weightInput" placeholder="70" inputmode="decimal">
          </div>
          <div class="input-box">
            <label>Height (cm)</label>
            <input type="number" id="heightInput" placeholder="170" inputmode="decimal">
          </div>
        </div>

        <div class="result-number" id="resultNumber">--</div>
        <div class="result-category" id="resultCategory">&nbsp;</div>

        <div class="bar-wrap">
          <div class="bar"></div>
          <div class="indicator" id="indicator"></div>
        </div>
        <div class="labels-row">
          <span class="underweight">Underweight</span>
          <span class="normal">Normal</span>
          <span class="overweight">Overweight</span>
          <span class="obese">Obese</span>
        </div>
        <div class="ranges-row">
          <span>&lt; 18.5</span>
          <span>18.5 - 24.9</span>
          <span>25 - 29.9</span>
          <span>&gt; 30</span>
        </div>

        <div class="buttons-row">
          <button class="btn-reset" id="resetBtn">Reset</button>

          <button class="btn-calc" id="calcBtn">Calculate my profile</button>
        </div>
      </div>

    </div>

  </div>
  <script src="healthprofile.js"></script>
</body>

</html>
